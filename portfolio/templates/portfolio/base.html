{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}My Portfolio{% endblock %}</title>
<link rel="stylesheet" href="{% static 'portfolio/css/style.css' %}">
</head>
<body>

<header class="navbar">
    <div class="navbar-inner">
        <a href="{% url 'portfolio:home' %}" class="brand">Anwarul<span>.dev</span></a>
        <nav class="nav-links" id="navLinks">
            <a href="{% url 'portfolio:home' %}">Home</a>
            <a href="{% url 'portfolio:project_list' %}">Projects</a>
            <a href="{% url 'portfolio:about' %}">About</a>
            <a href="{% url 'portfolio:contact' %}">Contact</a>
        </nav>
        <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation">
            <span></span><span></span><span></span>
        </button>
    </div>
</header>

<main class="page-content">
    {% block content %}{% endblock %}
</main>

<footer class="site-footer">
    <div class="footer-inner">
        <p>&copy; {% now "Y" %} Anwarul Islam Anik. Built with Django.</p>
        <div class="footer-links">
            <a href="https://github.com/" target="_blank" rel="noopener">GitHub</a>
            <a href="{% url 'portfolio:contact' %}">Contact</a>
        </div>
    </div>
</footer>

<script>
    const toggle = document.getElementById('navToggle');
    const links = document.getElementById('navLinks');
    toggle.addEventListener('click', () => links.classList.toggle('open'));
</script>
</body>
</html>
